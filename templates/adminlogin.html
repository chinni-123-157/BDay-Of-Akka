{% extends "base.html" %}
{% block title %}Admin login{% endblock %}
{% block content %}
<section class="glass card hero">
  <p class="flute">🔐</p><h1>Admin</h1>
  {% if err %}<p class="notice">{{ err }}</p>{% endif %}
  <form method="post">
    <input name="username" placeholder="Admin username" autocomplete="username" required>
    <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="btn">Sign in</button>
  </form>
  <a class="adminlink" href="{{ url_for('home') }}">← Back</a>
</section>
{% endblock %}
