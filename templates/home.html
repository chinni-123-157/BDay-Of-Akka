{% extends "base.html" %}
{% block content %}
<section class="glass card hero">
  <p class="flute">🦚</p>
  <h1>Happy Birthday!</h1>
  <p class="sub">Radha Krishna bless this day. Sign in to open your surprise.</p>
  <div class="tabs">
    <button class="tab {{ 'on' if tab=='login' }}" data-t="login">Log in</button>
    <button class="tab {{ 'on' if tab=='signup' }}" data-t="signup">Sign up</button>
  </div>
  <form id="login" class="pane {{ 'on' if tab=='login' }}" method="post" action="{{ url_for('login') }}">
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Password" required>
    <button class="btn">Log in</button>
  </form>
  <form id="signup" class="pane {{ 'on' if tab=='signup' }}" method="post" action="{{ url_for('signup') }}">
    <input name="name" placeholder="Your name" required>
    <input name="email" type="email" placeholder="Email" required>
    <input name="password" type="password" placeholder="Choose a password" required>
    <input name="key" type="password" placeholder="Secret key (ask the birthday host)" required>
    <button class="btn">Create account</button>
  </form>
  {% if google %}<a class="btn ghost" href="{{ url_for('google_login') }}"><b class="g">G</b> Continue with Google</a>{% endif %}
</section>
{% endblock %}
{% block scripts %}<script>
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab,.pane').forEach(e=>e.classList.remove('on'));
  b.classList.add('on'); document.getElementById(b.dataset.t).classList.add('on');
});
</script>{% endblock %}
