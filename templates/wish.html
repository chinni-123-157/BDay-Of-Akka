{% extends "base.html" %}
{% block title %}Reels{% endblock %}
{% block body_class %}reelpage{% endblock %}
{% block content %}
<section class="phone glass reels">
  <div class="stories" id="stories"><button class="story mute" id="mute" aria-label="Toggle sound"><span>🔇</span><small>Sound</small></button></div>
  <div class="feed" id="feed"></div>
  <p id="empty" class="sub empty" hidden>No videos yet 🎬<br>Post one from your <a href="{{ url_for('dashboard') }}">dashboard</a>!</p>
</section>
{% endblock %}
{% block scripts %}<script>
const feed=document.getElementById('feed'), empty=document.getElementById('empty'), stories=document.getElementById('stories');
let muted=true, all=[];
function build(items){
  feed.innerHTML=''; empty.hidden=items.length>0;
  items.forEach((it,i)=>{
    const d=document.createElement('article'); d.className='reel';
    d.innerHTML=`<video playsinline preload="metadata"></video><div class="shade"></div><div class="heart-pop">♥</div>
      <div class="rail"><button class="act like" aria-label="Like">♥</button><button class="act send" aria-label="Share">➤</button></div>
      <div class="cap"><b></b><span></span></div>`;
    const v=d.querySelector('video'); v.src=it.url; v.muted=muted;
    d.querySelector('.cap b').textContent='@'+it.person; d.querySelector('.cap span').textContent=it.caption||`Wish ${i+1} of ${items.length}`;
    v.addEventListener('ended',()=>(d.nextElementSibling||feed.firstElementChild).scrollIntoView({behavior:'smooth'}));
    v.addEventListener('click',()=>v.paused?v.play():v.pause());
    const like=d.querySelector('.like'), pop=d.querySelector('.heart-pop');
    like.onclick=()=>{ like.classList.toggle('on'); pop.classList.remove('go'); void pop.offsetWidth; pop.classList.add('go'); };
    v.addEventListener('dblclick',()=>{ if(!like.classList.contains('on')) like.click(); });
    d.querySelector('.send').onclick=async()=>{ try{ if(navigator.share) await navigator.share({title:'Birthday wish',url:location.origin}); else {await navigator.clipboard.writeText(location.origin); alert('Link copied!');} }catch{} };
    feed.appendChild(d); io.observe(d);
  });
}
const io=new IntersectionObserver(es=>es.forEach(e=>{ const v=e.target.querySelector('video');
  if(e.isIntersecting){ v.muted=muted; v.currentTime=0; v.play().catch(()=>{}); } else v.pause(); }),{root:feed,threshold:.7});
function chips(){
  const names=[...new Set(all.map(x=>x.person))];
  [['','All'],...names.map(n=>[n,n])].reverse().forEach(([val,label])=>{ const b=document.createElement('button'); b.className='story'+(val===''?' on':''); b.dataset.p=val;
    b.innerHTML='<span></span><small></small>'; b.querySelector('span').textContent=val===''?'★':label[0].toUpperCase(); b.querySelector('small').textContent=label;
    b.onclick=()=>{ stories.querySelectorAll('.story:not(.mute)').forEach(x=>x.classList.toggle('on',x===b)); build(val?all.filter(x=>x.person===val):all); }; stories.prepend(b); });
}
document.getElementById('mute').onclick=e=>{ muted=!muted; e.currentTarget.querySelector('span').textContent=muted?'🔇':'🔊'; document.querySelectorAll('.reel video').forEach(v=>v.muted=muted); };
fetch('/api/videos').then(r=>r.json()).then(items=>{ all=items; chips(); build(all); });
</script>{% endblock %}
