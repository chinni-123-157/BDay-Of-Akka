<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Happy Birthday{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito:wght@400;600;800&family=Bangers&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
<div class="wall" id="wallA"></div><div class="wall" id="wallB"></div><div class="veil"></div>
{% if session.uid %}
<nav class="glass nav">
  <a href="{{ url_for('wish') }}">Wishes</a>
  <a href="{{ url_for('questions') }}">Questions</a>
  <span class="grow"></span>
  <span class="who">{{ session.name }}</span>
  <a href="{{ url_for('logout') }}">Log out</a>
</nav>
{% endif %}
<main class="page">{% block content %}{% endblock %}</main>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
